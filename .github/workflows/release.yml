name: npm release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@^11.5.1
      - run: node -e 'const url = require("./packages/mcp/package.json").repository?.url; if (!url) throw new Error("Set repository.url to this GitHub repository before publishing")'
      - run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./packages/mcp/package.json').version")"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:packed
      - run: npm publish --workspace @bhoomabrsr/skimlet --access public --provenance
